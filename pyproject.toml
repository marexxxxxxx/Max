[project]
name = "max"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "faster-whisper>=1.0",
  "pyannote.audio>=3.1",
  "kokoro>=0.2",
  "langgraph>=0.2",
  "ollama>=0.4",
  "sounddevice>=0.5",
  "webrtcvad>=2.0",
  "setuptools<81",
  "PyYAML>=6.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
